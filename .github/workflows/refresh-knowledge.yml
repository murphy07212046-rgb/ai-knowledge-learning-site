name: Refresh public AI knowledge

on:
  schedule:
    - cron: "15 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/refresh-knowledge.mjs
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_API_BASE_URL: ${{ secrets.AI_API_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
      - run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "ai-knowledge-bot"
          git config user.email "ai-knowledge-bot@users.noreply.github.com"
          git add public/data/knowledge.json public/data/knowledge.js
          git commit -m "chore: refresh public AI knowledge"
          git push
